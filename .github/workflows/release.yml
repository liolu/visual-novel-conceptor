# Publie une version quand on pousse un tag vX.Y.Z (ex: git tag v0.2.0 && git push --tags).
# L'éditeur lit la dernière release pour se mettre à jour tout seul : les noms des
# fichiers (vn-editor-<cible>, vn-player-<cible>) doivent rester identiques.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Vérifie que le tag correspond à la version de Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} ≠ version $VERSION"; exit 1; }
      - run: cargo build --release --target ${{ matrix.target }} -p vn-editor -p vn-player
      - name: Renomme les binaires
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/vn-editor${{ matrix.ext }} dist/vn-editor-${{ matrix.target }}${{ matrix.ext }}
          cp target/${{ matrix.target }}/release/vn-player${{ matrix.ext }} dist/vn-player-${{ matrix.target }}${{ matrix.ext }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  android:
    runs-on: ubuntu-latest
    # Expérimental : ne bloque pas la publication des versions PC.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Construit l'APK de l'éditeur
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-apk --locked
          cargo apk build -p vn-editor --lib --release --target aarch64-linux-android
          mkdir dist && find target -name "*.apk" -path "*release*" -exec cp {} dist/vn-conceptor-android.apk \;
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
